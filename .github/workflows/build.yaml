name: "Build Xiaomi MIX 4 odin RCU nocb diagnostic from Nov 19 baseline (UNTESTED)"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h
      - name: Build and verify pinned arm64 kernel package
        run: bash scripts/build-kernel.sh
      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-MIX4-odin-RCU-NOCBS-ALL-DIAGNOSTIC-UNTESTED
          path: out/
          if-no-files-found: warn
          retention-days: 14
